<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .header {
            width: 100%;
            margin-bottom: 20px;
        }

        .header img {
            height: 60px;
        }

        .header .left {
            float: left;
        }

        .header .right {
            float: right;
        }

        .clearfix {
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="left">
            <img src="assets/img/logo-dki-jakarta.png">
        </div>

        <div class="right">
            <img src="assets/img/ukt2logo.png">
        </div>

        <div class="clearfix"></div>
    </div>
</body>
</html>
